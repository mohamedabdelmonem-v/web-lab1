<!DOCTYPE html>       <!-- doc type-->
<html lang="en">      <!-- english language-->

<head>     <!-- the data section -->
    <meta charset="UTF-8">    <!-- meta tag-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Gym - Contact Us</title>  <!-- page title-->
</head>

<body>   <!-- visual content -->

    <header>
        <h1>Golden Gym</h1> <!-- webpage title -->
        <nav>   <!-- Navigation links -->
            <ul>    
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services & Plans</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>       

    <main>  <!-- contact form section -->
        <h2>Get in Touch with Us</h2>
        
        <!-- Contact Form -->
        <form action="#" method="post">
            <fieldset>
                <legend>Personal Information & Inquiries</legend>

                <!-- Input Pairs -->
                <p>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </p>

                <p>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="joindate">Preferred Start Date:</label>
                    <input type="date" id="joindate" name="joindate">
                </p>

                <!-- Select option dropdown -->
                <p>
                    <label for="membership">Interested Plan:</label>
                    <select id="membership" name="membership">
                        <option value="basic">Basic Plan</option>
                        <option value="silver">Silver Plan</option>
                        <option value="gold">Gold Plan</option>
                        <option value="vip">VIP Platinum</option>
                    </select>
                </p>

                <!-- Textarea -->
                <p>
                    <label for="message">Your Message or Questions:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40"></textarea>
                </p>

                <!-- Submit Button -->
                <p>
                    <button type="submit">Send Message</button>
                </p>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Golden Gym. Created by [MOHAMED ABDELMONEM]. All rights reserved.</p>
    </footer>

</body>
</html>
